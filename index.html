    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
    }

    body {
      background-color: #B4511E;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Marcellus', Georgia, serif;
    }

    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Logo image */
    .logo {
      width: min(480px, 72vw);
      height: auto;
      margin-bottom: 72px;
      display: block;
    }

    /* "CRAFTING IN PROGRESS" */
    .headline {
      font-family: 'Marcellus', Georgia, serif;
      font-size: clamp(1.8rem, 5.2vw, 3.5rem);
      font-weight: 400;
      color: #EFE5CF;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      line-height: 1.1;
      margin-bottom: 48px;
    }

    /* Contact lines */
    .contact {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .contact-line {
      font-family: 'Marcellus', Georgia, serif;
      font-size: 0.78rem;
      font-weight: 400;
